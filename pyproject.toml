[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "grail-accidents"
version = "0.1.0"
description = "Auditable ordinal traffic-disruption research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.2", "pyarrow>=14", "duckdb>=1.1", "matplotlib>=3.7", "joblib>=1.3"]
[project.optional-dependencies]
boosting = ["xgboost>=2", "catboost>=1.2"]
test = ["pytest>=8"]
[project.scripts]
grail = "grail.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
